name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.pin.outputs.enabled }}
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Shoes source pin
        id: pin
        shell: bash
        run: |
          if [[ ! -f shoes-ref ]]; then
            echo '::error::shoes-ref is missing; set it to UNSET or a full cfal/shoes commit SHA.'
            exit 1
          fi
          ref="$(< shoes-ref)"
          bytes="$(wc -c < shoes-ref)"
          if [[ "$ref" == UNSET && "$bytes" -eq 6 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Documentation publication is disabled: shoes-ref is UNSET. Set it to a reachable cfal/shoes commit SHA to resume.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$bytes" -eq 41 && "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo '::error::shoes-ref must be exactly UNSET or one lowercase 40-character commit SHA, followed by a newline.'
            exit 1
          fi

  build:
    needs: source
    if: needs.source.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned Shoes source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cfal/shoes
          ref: ${{ needs.source.outputs.ref }}
          path: shoes
          persist-credentials: false
      - name: Check source prerequisites
        shell: bash
        env:
          EXPECTED_REF: ${{ needs.source.outputs.ref }}
        run: |
          if [[ "$(git -C shoes rev-parse HEAD)" != "$EXPECTED_REF" ]]; then
            echo '::error::Checked-out Shoes commit does not match shoes-ref.'
            exit 1
          fi
          for file in package.json package-lock.json .node-version; do
            if [[ ! -f "shoes/docs/$file" ]]; then
              echo "::error::Pinned Shoes commit lacks docs/$file. Merge docs into cfal/shoes and update shoes-ref."
              exit 1
            fi
          done
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: shoes/docs/.node-version
          cache: npm
          cache-dependency-path: shoes/docs/package-lock.json
      - name: Install, check, and build
        working-directory: shoes/docs
        env:
          SHOES_DOCS_REF: ${{ needs.source.outputs.ref }}
          SHOES_DOCS_LABEL: Unreleased / development
        run: |
          npm ci
          npm run check
      - name: Upload Pages artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: shoes/docs/dist

  deploy:
    needs: [source, build]
    if: needs.source.outputs.enabled == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
